<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Signing in&hellip; | Droogle Dashboard</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(../outfit-latin-400-normal.woff2)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1322;color:#c9d3e6;font:15px/1.5 Outfit,system-ui,sans-serif;text-align:center;padding:16px}
a{color:#25d6c8}
</style>
</head><body>
<p id="m">Signing you in with Twitch&hellip;</p>
<script>
/* Twitch sends the viewer back here after "Log in with Twitch" (implicit grant flow). The token arrives in the address
   fragment; it is kept in this browser only and the viewer goes straight back to the page they came from. */
(function () {
  var SITE = location.origin + '/droogle-guide/';
  var p = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  var want = '', back = SITE + '#me';
  try { want = sessionStorage.getItem('dgTwState') || ''; var b = sessionStorage.getItem('dgTwBack') || ''; if (b.indexOf(SITE) === 0) back = b; sessionStorage.removeItem('dgTwState'); } catch (e) {}
  var tok = p.get('access_token'), st = p.get('state') || q.get('state');
  history.replaceState(null, '', location.pathname);           // the token never stays in the address bar or history
  if (tok && st && want && st === want && /^[a-z0-9]{10,60}$/i.test(tok)) {
    try { localStorage.setItem('dgTwTok', tok); localStorage.removeItem('dgTwWho'); } catch (e) {}
    location.replace(back);
  } else if (q.get('error') || p.get('error')) {
    location.replace(back.replace(/#me$/, ''));                  // they chose not to sign in
  } else {
    document.getElementById('m').innerHTML = 'That sign-in didn’t work. <a href="' + SITE + '">Back to the Dashboard</a> and try again.';
  }
})();
</script>
</body></html>
